name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app_system/functions/requirements.txt
          pip install flake8 black
      - name: Format check (black)
        run: black --check app_system/indexer.py app_system/functions/main.py
      - name: Lint (flake8)
        run: flake8 app_system/indexer.py app_system/functions/main.py
