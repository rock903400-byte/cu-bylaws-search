<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>協會法規智慧索引系統</title>
    <!-- PDF.js 的樣式 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <link rel="stylesheet" href="styles.css?v=1.4">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo">
                <h1>法規<span>智慧索引</span></h1>
            </div>
            <nav class="main-nav">
                <a href="#" class="nav-item active" data-source="association">法規</a>
                <a href="#" class="nav-item" data-source="internal">內部法規</a>
            </nav>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="輸入關鍵字搜尋內文（例如：穩定基金）..." autocomplete="off">
            <button id="search-btn">搜尋</button>
        </div>
    </header>

    <main>
        <aside id="sidebar">
            <h3>快速分類</h3>
            <ul id="category-list">
                <li class="active" data-cat="all">全部法規</li>
                <!-- 動態注入分類 -->
            </ul>
        </aside>

        <section id="results-section">
            <div id="status-bar">
                找到 <span id="count">0</span> 項結果
            </div>
            <div id="results-list">
                <!-- 搜尋結果 -->
                <div class="empty-state">
                    請輸入關鍵字開始搜尋
                </div>
            </div>
        </section>

        <section id="preview-section">
            <div id="preview-header">
                <span id="preview-title">文件預覽</span>
                <div style="display: flex; align-items: center;">
                    <!-- 關鍵字跳轉控制項 -->
                    <div id="keyword-nav" style="display: none; align-items: center; margin-right: 15px; background: rgba(255,255,255,0.1); border-radius: 4px; padding: 2px 10px; border: 1px solid rgba(255,255,255,0.2);">
                        <span id="match-count" style="font-size: 0.9rem; color: #fff; margin-right: 12px; font-weight: 500; min-width: 45px; text-align: center;">0 / 0</span>
                        <div style="display: flex; gap: 4px;">
                            <button id="prev-match" title="上一個" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; padding: 2px 10px; border-radius: 3px; font-size: 0.8rem; transition: background 0.2s;">▲</button>
                            <button id="next-match" title="下一個" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; padding: 2px 10px; border-radius: 3px; font-size: 0.8rem; transition: background 0.2s;">▼</button>
                        </div>
                    </div>
                    <button id="close-preview">關閉</button>
                </div>
            </div>
            <div id="preview-container">
                <div class="preview-placeholder">點擊搜尋結果進行預覽</div>
                <iframe id="preview-frame" src="" frameborder="0"></iframe>
                <div id="docx-viewer"></div>
                <div id="pdf-viewer"></div>
            </div>
        </section>
    </main>

    <!-- 引入 Mammoth (處理 Word), PDF.js (處理 PDF) 與 Mark.js (螢光筆) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/mark.min.js"></script>
    <script src="app.js?v=1.4"></script>
</body>
</html>
